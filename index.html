<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>חוקרי הרחובות</title>
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">חוקרי הרחובות</h1>
      <form class="picker" id="picker">
        <label class="visually-hidden" for="city-select">בחרו עיר</label>
        <!-- Placeholder until milestone 2 loads the municipality list from Overpass. -->
        <select id="city-select" disabled>
          <option>כפר סבא</option>
        </select>
        <button type="submit" id="map-it" disabled>הצג במפה</button>
      </form>
    </header>

    <main class="city-view">
      <section class="map-pane" aria-label="מפה">
        <div id="map"></div>
      </section>
      <aside class="list-pane" aria-label="רשימת רחובות">
        <div class="list-header">
          <h2 id="city-name">כפר סבא</h2>
          <p class="list-summary" id="list-summary">בחרו עיר ולחצו „הצג במפה״</p>
        </div>
        <ol class="street-list" id="street-list"></ol>
      </aside>
    </main>

    <footer class="app-footer">
      נתונים:
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener"
        >© תורמי OpenStreetMap</a
      >
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
